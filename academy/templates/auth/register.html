{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}{{ _('Register') }} · {{ site_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:auto">
  <h1>{{ _('Student registration') }}</h1>
  <form method="post" class="stack">{{ csrf() }}
    <label for="full_name">{{ _('Full name') }}</label><input type="text" id="full_name" name="full_name" value="{{ form.get('full_name','') }}" required>
    <label for="email">{{ _('Email') }}</label><input type="email" id="email" name="email" value="{{ form.get('email','') }}" required>
    <label for="phone">{{ _('Phone (for payment and updates)') }}</label><input type="tel" id="phone" name="phone" value="{{ form.get('phone','') }}" placeholder="+251 9…">
    <label for="city">{{ _('City') }}</label><input type="text" id="city" name="city" value="{{ form.get('city','') }}">
    <label for="password">{{ _('Password (at least 8 characters)') }}</label><input type="password" id="password" name="password" minlength="8" required>
    <label for="password2">{{ _('Confirm password') }}</label><input type="password" id="password2" name="password2" minlength="8" required>
    <label class="check"><input type="checkbox" name="agree" value="1" required> {{ _('I accept the %(link)s and will not share my account or course materials.', link=('<a href="%s" target="_blank">%s</a>'|format(url_for('main.policy', page='terms'), _('terms of use')))|safe) }}</label>
    <p><button class="btn">{{ _('Create account') }}</button></p>
  </form>
  <p class="small">{{ _('Already registered?') }} <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">{{ _('Log in') }}</a></p>
</div>
{% endblock %}
