server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 1024M;   # large lecture video uploads

    location /static/ {
        alias /opt/kasina/kasina/static/;
        expires 7d;
    }
    # Lecture videos stored on this server. Only reachable through the app's
    # X-Accel-Redirect after it has checked the student's access ("internal").
    location /_protected_videos/ {
        internal;
        alias /var/lib/kasina/uploads/videos/;
        add_header Cache-Control "private, no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;          # stream videos without buffering to disk
    }
}
