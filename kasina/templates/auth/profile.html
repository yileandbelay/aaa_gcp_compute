{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block content %}
<div class="card" style="max-width:560px">
  <h1>My profile</h1>
  <p class="muted">{{ current_user.email }} · {{ current_user.role|capitalize }} · joined {{ current_user.created_at.strftime('%d %b %Y') }}</p>
  <form method="post" class="stack">{{ csrf() }}
    <label>Full name</label><input type="text" name="full_name" value="{{ current_user.full_name }}" required>
    <label>Phone</label><input type="tel" name="phone" value="{{ current_user.phone or '' }}">
    <label>City</label><input type="text" name="city" value="{{ current_user.city or '' }}">
    <h3>Change password</h3>
    <label>Current password</label><input type="password" name="current_password">
    <label>New password</label><input type="password" name="new_password" minlength="8">
    <p><button class="btn">Save</button></p>
  </form>
</div>
{% endblock %}
